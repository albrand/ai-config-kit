name: inspect-run
on: workflow_dispatch
permissions:
  contents: read
  actions: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  inspect:
    env: { NOTE: 'hello
      # harmless', GH_TOKEN: ''
    }
    runs-on: ubuntu-latest
# comment before steps does not end the job
    steps:
      - run: gh run view "$RUN_ID"
