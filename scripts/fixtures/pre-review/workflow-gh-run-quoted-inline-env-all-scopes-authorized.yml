name: inspect-run
on: workflow_dispatch
permissions:
  contents: read
  actions: read
"env": { GH_TOKEN: "${{ github.token }}" }
jobs:
  inspect:
    'env': { GH_TOKEN: '${{ github.token }}' }
    runs-on: ubuntu-latest
    steps:
      - run: gh run view "$RUN_ID"
        "env": { GH_TOKEN: "${{ github.token }}" }
