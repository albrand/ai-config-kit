name: trusted-qa-publisher
on:
  workflow_run:
    workflows: [authoritative-qa-gate]
    types: [completed]
permissions:
  actions: read
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: acme-qa/qa-authority
          ref: main
          path: qa-authority
          token: ${{ secrets.QA_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qa-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: publisher-input/plan
      - uses: actions/download-artifact@v4
        with:
          name: qa-run-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: publisher-input/results
      - uses: actions/download-artifact@v4
        with:
          pattern: qa-report-*
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: publisher-input/report
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build trusted run identity
        env:
          PLAN_FILE: publisher-input/plan/qa-plan.json
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node -e 'const fs=require("node:fs");const plan=JSON.parse(fs.readFileSync(process.env.PLAN_FILE,"utf8"));fs.writeFileSync("publisher-input/metadata.json",JSON.stringify({kind:"qa-publish-artifact",schemaVersion:1,commit:plan.headSha,runId:process.env.EXPECTED_RUN_ID})+"\n")'
      - name: Recompute and publish from the trusted plan and raw runner evidence
        env:
          QA_BOARD_WRITE_TOKEN: ${{ secrets.QA_BOARD_WRITE_TOKEN }}
          PUBLISH_ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node qa-authority/qa/bin/qa.mjs publish-evidence --config qa-authority/qa/qa.config.json --plan publisher-input/plan/qa-plan.json --scenarios qa-authority/qa/scenarios.json --results publisher-input/results/run-v1.json --metadata publisher-input/metadata.json --artifact "$PUBLISH_ARTIFACT_URL" --expected-run-id "$EXPECTED_RUN_ID" --receipt-output board-receipt.json --apply
