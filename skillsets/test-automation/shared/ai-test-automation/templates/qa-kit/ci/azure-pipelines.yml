trigger: none
resources:
  repositories:
  - repository: qaAuthority
    type: git
    name: acme-qa/qa-authority
    ref: refs/heads/main
pr:
  branches:
    include: ['main', 'release/*']
parameters:
- name: release
  type: boolean
  default: false
- name: pullRequestId
  type: string
  default: ''
- name: changeUrl
  type: string
  default: ''
variables:
  nodeVersion: '22.x'
stages:
- stage: Plan
  jobs:
  - job: plan
    steps:
    - checkout: qaAuthority # declare a repository resource; authorize it on first run
    - task: NodeTool@0
      inputs: { versionSpec: '$(nodeVersion)' }
    - bash: |
        node qaAuthority/qa/bin/qa.mjs plan --config qaAuthority/qa/qa.config.json --scenarios qaAuthority/qa/scenarios.json --base-scenarios qaAuthority/qa/base-scenarios.json --base "$(System.PullRequest.TargetCommitId)" --head "$(Build.SourceVersion)" --pull-request "${{ parameters.pullRequestId }}" --change-url "${{ parameters.changeUrl }}" --output qa-plan.json
      displayName: Plan board-associated work items and base regressions; report unlinked text hints only
      env:
        QA_BOARD_READ_TOKEN: $(QA_BOARD_READ_TOKEN)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    - bash: echo "##vso[task.setvariable variable=needsBase;isOutput=true]$(node -e 'const u=v=>Array.isArray(v)?v:(v.scenarios??v);const head=u(require("./qaAuthority/qa/scenarios.json"));const base=new Map(u(require("./qaAuthority/qa/base-scenarios.json")).map(s=>[s.id,JSON.stringify(s)]));console.log(head.some(s=>base.get(s.id)!==JSON.stringify(s)));')"
      name: base
      displayName: Detect new or changed scenarios (these need a merge-base run)
    - publish: qa-plan.json
      artifact: qa-plan
    - publish: qaAuthority/qa
      artifact: qa-authority
- stage: Test
  dependsOn: Plan
  jobs:
  - job: token_free_tests
    steps:
    - download: current
      artifact: qa-plan
    - checkout: self
      persistCredentials: false
    - download: current
      artifact: qa-authority
    - task: NodeTool@0
      inputs: { versionSpec: '$(nodeVersion)' }
    - script: node "$(Pipeline.Workspace)/qa-authority/bin/qa.mjs" install-authoritative --source "$(Pipeline.Workspace)/qa-authority" --target . --config "$(Pipeline.Workspace)/qa-authority/qa.config.json"
      displayName: Overlay QA-owned tests and list ignored branch copies
    - script: node "$(Pipeline.Workspace)/qa-authority/bin/qa.mjs" test --config "$(Pipeline.Workspace)/qa-authority/qa.config.json" --plan "$(Pipeline.Workspace)/qa-plan/qa-plan.json" --commit "$(Build.SourceVersion)" --output qa-results/run-v1.json --no-network-writes
      displayName: Run authoritative suite without secrets
    - publish: qa-results
      artifact: qa-run-results
      condition: always()
    - publish: allure-results
      artifact: allure-results
      condition: always()
  - job: base_proof
    condition: eq(stageDependencies.Plan.plan.outputs['base.needsBase'], 'true')
    steps:
    - download: current
      artifact: qa-plan
    - checkout: self
      fetchDepth: 0
      persistCredentials: false
    - download: current
      artifact: qa-authority
    - task: NodeTool@0
      inputs: { versionSpec: '$(nodeVersion)' }
    - bash: |
        set -euo pipefail
        mb="$(node "$(Pipeline.Workspace)/qa-authority/bin/qa.mjs" merge-base --head "$(System.PullRequest.SourceCommitId)" --target "$(System.PullRequest.TargetCommitId)" --output qa-base-results/base-meta.json)"
        git checkout --detach "$mb"
        echo "##vso[task.setvariable variable=baseSha]$mb"
      displayName: Resolve the real merge base of head and target and check it out
    - script: node "$(Pipeline.Workspace)/qa-authority/bin/qa.mjs" install-authoritative --source "$(Pipeline.Workspace)/qa-authority" --target . --config "$(Pipeline.Workspace)/qa-authority/qa.config.json"
      displayName: Overlay the head QA tests on the merge-base application code
    - bash: |
        status=0
        node "$(Pipeline.Workspace)/qa-authority/bin/qa.mjs" test --config "$(Pipeline.Workspace)/qa-authority/qa.config.json" --plan "$(Pipeline.Workspace)/qa-plan/qa-plan.json" --commit "$(baseSha)" --output qa-base-results/base-run-v1.json --no-network-writes || status=$?
        # New scenarios are expected to fail on the merge base; that red run is the evidence. Only a missing results file is an error.
        if [ ! -f qa-base-results/base-run-v1.json ]; then echo "NOT RUN: the merge-base run wrote no base-run-v1.json (exit $status); new or changed scenarios have no red-on-base proof"; exit 1; fi
      displayName: Run the same scenarios on the merge base and write the base results
    - publish: qa-base-results
      artifact: qa-base-run-results
- stage: Judge
  dependsOn: [Plan, Test]
  condition: always()
  variables:
    needsBase: $[ stageDependencies.Plan.plan.outputs['base.needsBase'] ]
  jobs:
  - job: verdict
    steps:
    - checkout: qaAuthority
      path: qaAuthority
      persistCredentials: false
    - checkout: self
      path: app
      fetchDepth: 0
      persistCredentials: false
    - download: current
      artifact: qa-plan
    - download: current
      artifact: qa-run-results
    - download: current
      artifact: qa-base-run-results
      condition: eq(variables.needsBase, 'true')
    - script: |
        set -euo pipefail
        cd "$(Pipeline.Workspace)/qaAuthority"
        extra=()
        if [ "$(needsBase)" = "true" ]; then
          base_run="$(Pipeline.Workspace)/qa-base-run-results/base-run-v1.json"
          if [ ! -s "$base_run" ]; then echo "NOT RUN: red-on-base proof is missing for new or changed scenarios (no base-run-v1.json)"; exit 1; fi
          recorded="$(node -p "require('$(Pipeline.Workspace)/qa-base-run-results/base-meta.json').baseSha")"
          node qa/bin/qa.mjs merge-base --repo "$(Pipeline.Workspace)/app" --head "$(System.PullRequest.SourceCommitId)" --target "$(System.PullRequest.TargetCommitId)" --expect "$recorded" > /dev/null
          extra=(--base-results "$base_run")
        fi
        node qa/bin/qa.mjs judge --config qa/qa.config.json --plan "$(Pipeline.Workspace)/qa-plan/qa-plan.json" --results "$(Pipeline.Workspace)/qa-run-results" --base "$(System.PullRequest.TargetCommitId)" "${extra[@]}" --output verdict.json
      displayName: Judge every board-associated and base-regression scenario
    - publish: $(Pipeline.Workspace)/qaAuthority/verdict.json
      artifact: qa-verdict
      condition: always()
- stage: Report
  dependsOn: Judge
  condition: always()
  jobs:
  - job: report
    steps:
    - checkout: self
      persistCredentials: false
    - download: current
      artifact: allure-results
    - script: npm ci --ignore-scripts
      displayName: Install locked application reporting tools without lifecycle scripts
    - script: npx allure generate --config ./allurerc.mjs
      displayName: Generate Allure 3 single-file report
    - script: mkdir -p report-pending && cp -R allure-report report-pending/allure-report
      displayName: Assemble Allure-only report artifact; verdict remains in trusted QA code
    - publish: report-pending
      artifact: qa-report-pending-$(Build.SourceVersion)
- stage: DEV
  dependsOn: [Test, Judge, Report]
  condition: and(succeeded(), eq('${{ parameters.release }}', 'true'))
  jobs:
  - deployment: deploy_dev
    environment: DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - script: ./deploy.sh DEV "$(Build.SourceVersion)"
- stage: STAGING
  dependsOn: DEV
  condition: and(succeeded(), eq('${{ parameters.release }}', 'true'))
  # Secret variables are not exposed to scripts by default: keep QA_STAGING_USER / QA_STAGING_PASSWORD in this variable group
  # and map each one explicitly into the step env below. Names must match credentials.userEnv / passwordEnv; never echo them or set -x.
  variables:
  - group: qa-staging-credentials
  jobs:
  - deployment: deploy_staging
    environment: STAGING
    strategy:
      runOnce:
        deploy:
          steps:
          - script: ./deploy.sh STAGING "$(Build.SourceVersion)"
          - script: node qaAuthority/qa/bin/qa.mjs test --config qaAuthority/qa/qa.config.json --tier release-smoke --env staging --base-url "$(STAGING_URL)"
            env:
              CI: 'true'
              QA_STAGING_USER: $(QA_STAGING_USER)
              QA_STAGING_PASSWORD: $(QA_STAGING_PASSWORD)
- stage: PROD
  dependsOn: STAGING
  condition: and(succeeded(), eq('${{ parameters.release }}', 'true'))
  # Same rule as STAGING: QA_PRODUCTION_USER / QA_PRODUCTION_PASSWORD come from this variable group, mapped explicitly below.
  variables:
  - group: qa-production-credentials
  jobs:
  - deployment: deploy_prod
    environment: PROD
    strategy:
      runOnce:
        deploy:
          steps:
          - script: ./deploy.sh PROD "$(Build.SourceVersion)"
          - script: node qaAuthority/qa/bin/qa.mjs test --config qaAuthority/qa/qa.config.json --tier production-sanity --env production --base-url "$(PROD_URL)"
            env:
              CI: 'true'
              QA_PRODUCTION_USER: $(QA_PRODUCTION_USER)
              QA_PRODUCTION_PASSWORD: $(QA_PRODUCTION_PASSWORD)
