trigger: none
resources:
  repositories:
  - repository: qaAuthority
    type: git
    name: acme-qa/qa-authority
    ref: refs/heads/main
pr:
  branches:
    include: ['main', 'release/*']
parameters:
- name: release
  type: boolean
  default: false
variables:
  nodeVersion: '22.x'
stages:
- stage: Plan
  jobs:
  - job: plan
    steps:
    - checkout: self
      fetchDepth: 0
    - checkout: qaAuthority # declare a repository resource; authorize it on first run
    - task: NodeTool@0
      inputs: { versionSpec: '$(nodeVersion)' }
    - bash: |
        target_branch="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
        git fetch origin "+refs/heads/${target_branch}:refs/remotes/origin/${target_branch}"
        node qaAuthority/qa/bin/qa.mjs plan --config qaAuthority/qa/qa.config.json --scenarios qaAuthority/qa/scenarios.json --base-scenarios qaAuthority/qa/base-scenarios.json --base "origin/${target_branch}" --head "$(Build.SourceVersion)" --output qa-plan.json
      displayName: Plan linked/delivered tickets and base regressions
      env:
        QA_BOARD_READ_TOKEN: $(QA_BOARD_READ_TOKEN)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_PULLREQUEST_TARGETBRANCH: $(System.PullRequest.TargetBranch)
    - publish: qa-plan.json
      artifact: qa-plan
- stage: Test
  dependsOn: Plan
  jobs:
  - job: token_free_tests
    variables:
      QA_BOARD_TOKEN: ''
    steps:
    - download: current
      artifact: qa-plan
    - checkout: self
    - checkout: qaAuthority
    - task: NodeTool@0
      inputs: { versionSpec: '$(nodeVersion)' }
    - script: node qaAuthority/qa/bin/qa.mjs install-authoritative --source qaAuthority/qa --target . --config qaAuthority/qa/qa.config.json
      displayName: Overlay QA-owned tests and list ignored branch copies
    - script: node qaAuthority/qa/bin/qa.mjs test --config qaAuthority/qa/qa.config.json --plan "$(Pipeline.Workspace)/qa-plan/qa-plan.json" --output qa-results/run-v1.json --no-network-writes
      displayName: Run authoritative suite without secrets
    - publish: qa-results
      artifact: qa-run-results
      condition: always()
    - publish: allure-results
      artifact: allure-results
      condition: always()
- stage: Judge
  dependsOn: Test
  condition: always()
  jobs:
  - job: verdict
    steps:
    - checkout: qaAuthority
    - download: current
      artifact: qa-plan
    - download: current
      artifact: qa-run-results
    - script: node qaAuthority/qa/bin/qa.mjs judge --config qaAuthority/qa/qa.config.json --plan "$(Pipeline.Workspace)/qa-plan/qa-plan.json" --results "$(Pipeline.Workspace)/qa-run-results" --base "$(System.PullRequest.TargetCommitId)" --output verdict.json
      displayName: Judge every linked, related and base-regression scenario
    - publish: verdict.json
      artifact: qa-verdict
      condition: always()
- stage: Report
  dependsOn: Judge
  condition: always()
  jobs:
  - job: report
    steps:
    - checkout: self
    - checkout: qaAuthority
    - download: current
      artifact: qa-verdict
    - download: current
      artifact: allure-results
    - script: npm ci
      displayName: Install locked application reporting tools
    - script: npx allure generate --config ./allurerc.mjs
      displayName: Generate Allure 3 single-file report
    - script: node qaAuthority/qa/bin/qa.mjs report --config qaAuthority/qa/qa.config.json --verdict "$(Pipeline.Workspace)/qa-verdict/verdict.json" --output report-pending --allow-pending
      displayName: Generate pending report for work-item publication
    - script: cp -R allure-report report-pending/allure-report
      displayName: Include Allure artifact
    - publish: report-pending
      artifact: qa-report-pending-$(Build.SourceVersion)
    - script: node qaAuthority/qa/bin/qa.mjs board report --config qaAuthority/qa/qa.config.json --verdict "$(Pipeline.Workspace)/qa-verdict/verdict.json" --artifact "$QA_REPORT_URL" --commit "$(Build.SourceVersion)" --apply --receipt-output board-receipt.json
      displayName: Capture confirmed work-item report receipts
      env:
        QA_BOARD_WRITE_TOKEN: $(QA_BOARD_WRITE_TOKEN)
        QA_REPORT_URL: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)&view=artifacts
    - script: node qaAuthority/qa/bin/qa.mjs report --config qaAuthority/qa/qa.config.json --verdict "$(Pipeline.Workspace)/qa-verdict/verdict.json" --post-receipt board-receipt.json --output report
      displayName: Render final report from confirmed board receipts
    - script: cp -R allure-report report/allure-report
      displayName: Include Allure artifact
    - publish: report
      artifact: qa-report-$(Build.SourceVersion)
- stage: DEV
  dependsOn: [Test, Judge, Report]
  condition: and(succeeded(), eq('${{ parameters.release }}', 'true'))
  jobs:
  - deployment: deploy_dev
    environment: DEV
    strategy:
      runOnce:
        deploy:
          steps:
          - script: ./deploy.sh DEV "$(Build.SourceVersion)"
- stage: STAGING
  dependsOn: DEV
  condition: and(succeeded(), eq('${{ parameters.release }}', 'true'))
  jobs:
  - deployment: deploy_staging
    environment: STAGING
    strategy:
      runOnce:
        deploy:
          steps:
          - script: ./deploy.sh STAGING "$(Build.SourceVersion)"
          - script: node qaAuthority/qa/bin/qa.mjs test --config qaAuthority/qa/qa.config.json --tier release-smoke --base-url "$(STAGING_URL)"
- stage: PROD
  dependsOn: STAGING
  condition: and(succeeded(), eq('${{ parameters.release }}', 'true'))
  jobs:
  - deployment: deploy_prod
    environment: PROD
    strategy:
      runOnce:
        deploy:
          steps:
          - script: ./deploy.sh PROD "$(Build.SourceVersion)"
          - script: node qaAuthority/qa/bin/qa.mjs test --config qaAuthority/qa/qa.config.json --tier production-sanity --base-url "$(PROD_URL)"
